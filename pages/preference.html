<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>口味偏好设置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { theme: { extend: { colors: { brand: '#10B981', accent: '#F59E0B' } } } }</script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
        .screen { height: 100vh; overflow-y: auto; }
        .screen::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50">
    <div class="screen">
        <div class="bg-white px-6 pt-3 pb-2 flex justify-between items-center text-xs">
            <span class="font-medium">9:41</span>
            <div class="flex gap-1"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
        </div>
        <div class="bg-white px-4 py-3 flex items-center justify-between border-b border-gray-100">
            <a href="home.html" class="text-gray-600"><i class="fas fa-chevron-left text-lg"></i></a>
            <h1 class="font-semibold text-gray-900">口味偏好</h1>
            <button class="text-emerald-600 text-sm">保存</button>
        </div>
        
        <div class="px-4 py-4 pb-24 space-y-4">
            <!-- 荤素数量 -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 bg-emerald-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-utensils text-emerald-600"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-gray-900">每餐荤素数量</p>
                        <p class="text-xs text-gray-500">设置每天每餐的菜品数量</p>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div class="text-center">
                        <div class="flex items-center justify-center gap-2 mb-2">
                            <i class="fas fa-drumstick-bite text-red-400"></i>
                            <span class="font-bold text-gray-900">荤菜</span>
                        </div>
                        <select class="w-full bg-emerald-50 border border-emerald-200 rounded-lg py-2 text-center text-emerald-700">
                            <option>1个</option>
                            <option selected>2个</option>
                            <option>3个</option>
                        </select>
                    </div>
                    <div class="text-center">
                        <div class="flex items-center justify-center gap-2 mb-2">
                            <i class="fas fa-leaf text-green-400"></i>
                            <span class="font-bold text-gray-900">素菜</span>
                        </div>
                        <select class="w-full bg-green-50 border border-green-200 rounded-lg py-2 text-center text-green-700">
                            <option selected>1个</option>
                            <option>2个</option>
                        </select>
                    </div>
                    <div class="text-center">
                        <div class="flex items-center justify-center gap-2 mb-2">
                            <i class="fas fa-bowl-rice text-amber-400"></i>
                            <span class="font-bold text-gray-900">主食</span>
                        </div>
                        <select class="w-full bg-amber-50 border border-amber-200 rounded-lg py-2 text-center text-amber-700">
                            <option selected>1个</option>
                            <option>2个</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- 肉类偏好 -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 bg-rose-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-fish text-rose-500"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-gray-900">肉类偏好</p>
                        <p class="text-xs text-gray-500">选择喜欢的肉类（可多选）</p>
                    </div>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button class="px-4 py-2 bg-emerald-100 text-emerald-700 rounded-full text-sm border-2 border-emerald-500 flex items-center gap-2">
                        <span>🐔</span> 鸡肉
                        <i class="fas fa-check text-xs"></i>
                    </button>
                    <button class="px-4 py-2 bg-emerald-100 text-emerald-700 rounded-full text-sm border-2 border-emerald-500 flex items-center gap-2">
                        <span>🐟</span> 鱼肉
                        <i class="fas fa-check text-xs"></i>
                    </button>
                    <button class="px-4 py-2 bg-emerald-100 text-emerald-700 rounded-full text-sm border-2 border-emerald-500 flex items-center gap-2">
                        <span>🐄</span> 牛肉
                        <i class="fas fa-check text-xs"></i>
                    </button>
                    <button class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm border-2 border-transparent flex items-center gap-2">
                        <span>🐷</span> 猪肉
                    </button>
                    <button class="px-4 py-2 bg-emerald-100 text-emerald-700 rounded-full text-sm border-2 border-emerald-500 flex items-center gap-2">
                        <span>🦐</span> 虾
                        <i class="fas fa-check text-xs"></i>
                    </button>
                    <button class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm border-2 border-transparent flex items-center gap-2">
                        <span>🦆</span> 鸭肉
                    </button>
                </div>
            </div>
            
            <!-- 菜系偏好 -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 bg-amber-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-pepper-hot text-amber-600"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-gray-900">菜系偏好</p>
                        <p class="text-xs text-gray-500">选择喜欢的菜系（可多选）</p>
                    </div>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button class="px-3 py-2 bg-emerald-100 text-emerald-700 rounded-full text-sm border-2 border-emerald-500">川菜</button>
                    <button class="px-3 py-2 bg-emerald-100 text-emerald-700 rounded-full text-sm border-2 border-emerald-500">粤菜</button>
                    <button class="px-3 py-2 bg-gray-100 text-gray-600 rounded-full text-sm border-2 border-transparent">湘菜</button>
                    <button class="px-3 py-2 bg-emerald-100 text-emerald-700 rounded-full text-sm border-2 border-emerald-500">鲁菜</button>
                    <button class="px-3 py-2 bg-gray-100 text-gray-600 rounded-full text-sm border-2 border-transparent">浙菜</button>
                    <button class="px-3 py-2 bg-gray-100 text-gray-600 rounded-full text-sm border-2 border-transparent">苏菜</button>
                    <button class="px-3 py-2 bg-gray-100 text-gray-600 rounded-full text-sm border-2 border-transparent">闽菜</button>
                    <button class="px-3 py-2 bg-gray-100 text-gray-600 rounded-full text-sm border-2 border-transparent">徽菜</button>
                    <button class="px-3 py-2 bg-emerald-100 text-emerald-700 rounded-full text-sm border-2 border-emerald-500">家常菜</button>
                </div>
            </div>
            
            <!-- 口味禁忌 -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 bg-red-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-ban text-red-500"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-gray-900">饮食禁忌</p>
                        <p class="text-xs text-gray-500">不吃的食材或过敏源</p>
                    </div>
                </div>
                <div class="flex flex-wrap gap-2 mb-3">
                    <button class="px-3 py-2 bg-red-50 text-red-600 rounded-full text-sm border border-red-200 flex items-center gap-1">
                        香菜 <i class="fas fa-times text-xs"></i>
                    </button>
                    <button class="px-3 py-2 bg-red-50 text-red-600 rounded-full text-sm border border-red-200 flex items-center gap-1">
                        茼蒿 <i class="fas fa-times text-xs"></i>
                    </button>
                    <button class="px-3 py-2 bg-red-50 text-red-600 rounded-full text-sm border border-red-200 flex items-center gap-1">
                        海鲜 <i class="fas fa-times text-xs"></i>
                    </button>
                </div>
                <button class="w-full py-2 border-2 border-dashed border-gray-300 rounded-lg text-gray-400 text-sm flex items-center justify-center gap-2">
                    <i class="fas fa-plus"></i> 添加禁忌
                </button>
            </div>
            
            <!-- 复杂度偏好 -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-clock text-purple-600"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-gray-900">复杂度偏好</p>
                        <p class="text-xs text-gray-500">工作日与周末分别设置</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-50 rounded-xl p-3">
                        <p class="text-xs text-gray-500 mb-2">工作日（周一~周五）</p>
                        <select class="w-full bg-white border border-gray-200 rounded-lg py-2 px-3 text-sm">
                            <option selected>简单快手</option>
                            <option>中等难度</option>
                        </select>
                    </div>
                    <div class="bg-gray-50 rounded-xl p-3">
                        <p class="text-xs text-gray-500 mb-2">周末（周六~周日）</p>
                        <select class="w-full bg-white border border-gray-200 rounded-lg py-2 px-3 text-sm">
                            <option>精致复杂</option>
                            <option selected>中等难度</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- 周预算 -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-coins text-blue-600"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-gray-900">周预算</p>
                        <p class="text-xs text-gray-500">设置每周餐饮预算上限</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <input type="range" min="100" max="2000" value="500" class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    <div class="bg-emerald-50 border border-emerald-200 rounded-lg px-4 py-2">
                        <span class="text-xl font-bold text-emerald-600">500</span>
                        <span class="text-sm text-gray-500">元</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
