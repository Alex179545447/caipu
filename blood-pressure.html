<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>血压记录 - 家庭健康驾驶舱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'safe-blue': '#2563eb',
                        'health-green': '#10b981',
                        'alert-orange': '#f59e0b',
                        'alarm-red': '#ef4444',
                        'bg-light': '#f8fafc',
                        'card-white': '#ffffff'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .touch-target { min-height: 56px; }
        .btn-radius { border-radius: 16px; }
        .dial-container {
            position: relative;
            width: 180px;
            height: 180px;
        }
        .dial {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            border: 8px solid #e5e7eb;
            position: relative;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.1);
        }
        .dial-indicator {
            position: absolute;
            width: 4px;
            height: 70px;
            background: linear-gradient(to bottom, #2563eb 0%, #3b82f6 100%);
            left: 50%;
            bottom: 50%;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(0deg);
            border-radius: 2px;
            transition: transform 0.1s ease-out;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }
        .dial-center {
            position: absolute;
            width: 24px;
            height: 24px;
            background: #2563eb;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
        }
        .dial-ticks {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .dial-tick {
            position: absolute;
            width: 2px;
            height: 12px;
            background: #9ca3af;
            left: 50%;
            top: 8px;
            transform-origin: center 82px;
        }
        .dial-tick.major {
            height: 16px;
            width: 3px;
            background: #6b7280;
        }
        .dial-value {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        .dial-value .number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2563eb;
        }
        .dial-value .unit {
            font-size: 1rem;
            color: #6b7280;
        }
        .slider-dial {
            -webkit-appearance: none;
            appearance: none;
            width: 180px;
            height: 180px;
            background: transparent;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
        }
        .adjust-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #f3f4f6;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #2563eb;
            touch-action: manipulation;
            user-select: none;
        }
        .adjust-btn:active {
            background: #2563eb;
            color: white;
        }
        @keyframes bounce-in {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .bounce-in {
            animation: bounce-in 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-bg-light min-h-screen pb-24">
    <!-- 顶部导航 -->
    <header class="bg-alarm-red text-white px-4 py-4 sticky top-0 z-50 shadow-lg">
        <div class="flex items-center justify-between">
            <a href="index.html" class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center">
                <i class="fas fa-arrow-left text-xl"></i>
            </a>
            <h1 class="text-xl font-bold">血压记录</h1>
            <a href="blood-pressure-trend.html" class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center">
                <i class="fas fa-chart-line text-xl"></i>
            </a>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="px-4 py-6 space-y-6">
        <!-- 血压输入区 -->
        <div class="bg-card-white rounded-2xl p-6 shadow-sm">
            <h2 class="text-xl font-bold text-gray-800 mb-6 text-center">
                <i class="fas fa-heartbeat text-alarm-red mr-2"></i>记录您的血压
            </h2>

            <!-- 收缩压 -->
            <div class="flex items-center justify-between py-4 border-b border-gray-100">
                <div class="text-left">
                    <p class="text-lg font-medium text-gray-600">收缩压</p>
                    <p class="text-sm text-gray-400">高压 (mmHg)</p>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="adjust-btn" onclick="adjustValue('systolic', -5)">
                        <i class="fas fa-minus"></i>
                    </button>
                    <div class="dial-container">
                        <div class="dial" id="systolicDial">
                            <div class="dial-ticks" id="systolicTicks"></div>
                            <div class="dial-indicator" id="systolicIndicator"></div>
                            <div class="dial-center"></div>
                        </div>
                        <div class="dial-value">
                            <span class="number" id="systolicValue">120</span>
                            <span class="unit">mmHg</span>
                        </div>
                    </div>
                    <button class="adjust-btn" onclick="adjustValue('systolic', 5)">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>

            <!-- 舒张压 -->
            <div class="flex items-center justify-between py-4 border-b border-gray-100">
                <div class="text-left">
                    <p class="text-lg font-medium text-gray-600">舒张压</p>
                    <p class="text-sm text-gray-400">低压 (mmHg)</p>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="adjust-btn" onclick="adjustValue('diastolic', -5)">
                        <i class="fas fa-minus"></i>
                    </button>
                    <div class="dial-container">
                        <div class="dial" id="diastolicDial">
                            <div class="dial-ticks" id="diastolicTicks"></div>
<div class="dial-indicator" id="diastolicIndicator"></div>
                            <div class="dial-center"></div>
                        </div>
                        <div class="dial-value">
                            <span class="number" id="diastolicValue">80</span>
                            <span class="unit">mmHg</span>
                        </div>
                    </div>
                    <button class="adjust-btn" onclick="adjustValue('diastolic', 5)">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>

            <!-- 心率 -->
            <div class="flex items-center justify-between py-4">
                <div class="text-left">
                    <p class="text-lg font-medium text-gray-600">心率</p>
                    <p class="text-sm text-gray-400">bpm</p>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="adjust-btn" onclick="adjustValue('pulse', -2)">
                        <i class="fas fa-minus"></i>
                    </button>
                    <div class="dial-container">
                        <div class="dial" id="pulseDial">
                            <div class="dial-ticks" id="pulseTicks"></div>
                            <div class="dial-indicator" id="pulseIndicator"></div>
                            <div class="dial-center"></div>
                        </div>
                        <div class="dial-value">
                            <span class="number" id="pulseValue">72</span>
                            <span class="unit">bpm</span>
                        </div>
                    </div>
                    <button class="adjust-btn" onclick="adjustValue('pulse', 2)">
                        <i class="fas fa-plus"></i>
                    </button>
                    </div>
                </div>
            </div>

            <!-- 血压状态提示 -->
            <div id="bpStatus" class="mt-6 p-4 rounded-xl text-center">
                <div class="flex items-center justify-center">
                    <i class="fas fa-check-circle text-2xl mr-2" id="bpStatusIcon"></i>
                    <span class="text-lg font-medium" id="bpStatusText">血压正常</span>
                </div>
            </div>
        </div>

        <!-- 测量时间 -->
        <div class="bg-card-white rounded-2xl p-5 shadow-sm">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-lg font-medium text-gray-800">测量时间</p>
                    <p class="text-sm text-gray-500 mt-1" id="currentTime"></p>
                </div>
                <div class="flex items-center space-x-2">
                    <button class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center" onclick="setCurrentTime()">
                        <i class="fas fa-clock text-gray-600 text-lg"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 备注 -->
        <div class="bg-card-white rounded-2xl p-5 shadow-sm">
            <label class="block text-lg font-medium text-gray-800 mb-2">备注（可选）</label>
            <textarea id="note" class="w-full h-24 p-4 text-lg border-2 border-gray-200 rounded-xl focus:border-alarm-red focus:outline-none resize-none" placeholder="如：测量前静坐5分钟"></textarea>
        </div>

        <!-- 保存按钮 -->
        <div class="pt-4">
            <button onclick="saveRecord()" class="w-full py-5 bg-alarm-red text-white text-xl font-bold rounded-xl btn-radius touch-target shadow-lg">
                <i class="fas fa-save mr-2"></i>保存记录
            </button>
        </div>

        <!-- 历史记录 -->
        <div class="bg-card-white rounded-2xl p-5 shadow-sm">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-gray-800">
                    <i class="fas fa-history text-safe-blue mr-2"></i>最近记录
                </h2>
                <a href="blood-pressure-trend.html" class="text-safe-blue text-base font-medium">查看全部</a>
            </div>
            <div class="space-y-4" id="historyList">
                <div class="flex items-center justify-between p-4 bg-green-50 rounded-xl">
                    <div class="flex items-center">
                        <div class="w-12 h-12 bg-health-green rounded-full flex items-center justify-center mr-3">
                            <i class="fas fa-check text-white"></i>
                        </div>
                        <div>
                            <p class="text-lg font-medium text-gray-800">128 / 82 mmHg</p>
                            <p class="text-sm text-gray-500">心率 72 bpm</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-base font-medium text-health-green">正常</p>
                        <p class="text-sm text-gray-400">今天 08:30</p>
                    </div>
                </div>
                <div class="flex items-center justify-between p-4 bg-blue-50 rounded-xl">
                    <div class="flex items-center">
                        <div class="w-12 h-12 bg-safe-blue rounded-full flex items-center justify-center mr-3">
                            <i class="fas fa-check text-white"></i>
                        </div>
                        <div>
                            <p class="text-lg font-medium text-gray-800">125 / 78 mmHg</p>
                            <p class="text-sm text-gray-500">心率 68 bpm</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-base font-medium text-health-green">正常</p>
                        <p class="text-sm text-gray-400">昨天 20:15</p>
                    </div>
                </div>
                <div class="flex items-center justify-between p-4 bg-orange-50 rounded-xl">
                    <div class="flex items-center">
                        <div class="w-12 h-12 bg-alert-orange rounded-full flex items-center justify-center mr-3">
                            <i class="fas fa-exclamation text-white"></i>
                        </div>
                        <div>
                            <p class="text-lg font-medium text-gray-800">145 / 92 mmHg</p>
                            <p class="text-sm text-gray-500">心率 85 bpm</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-base font-medium text-alert-orange">偏高</p>
                        <p class="text-sm text-gray-400">昨天 08:00</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部导航 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-card-white border-t border-gray-200 px-4 py-2 z-50">
        <div class="flex justify-around items-center">
            <a href="index.html" class="flex flex-col items-center py-2 px-4 text-gray-400">
                <i class="fas fa-home text-2xl mb-1"></i>
                <span class="text-sm">首页</span>
            </a>
            <a href="add-reminder.html" class="flex flex-col items-center py-2 px-4 text-gray-400">
                <i class="fas fa-bell text-2xl mb-1"></i>
                <span class="text-sm">提醒</span>
            </a>
            <a href="blood-pressure.html" class="flex flex-col items-center py-2 px-4 text-alarm-red">
                <i class="fas fa-heartbeat text-2xl mb-1"></i>
                <span class="text-sm font-medium">血压</span>
            </a>
            <a href="blood-pressure-trend.html" class="flex flex-col items-center py-2 px-4 text-gray-400">
                <i class="fas fa-chart-line text-2xl mb-1"></i>
                <span class="text-sm">趋势</span>
            </a>
            <a href="#" class="flex flex-col items-center py-2 px-4 text-gray-400">
                <i class="fas fa-user text-2xl mb-1"></i>
                <span class="text-sm">我的</span>
            </a>
        </div>
    </nav>

    <!-- Toast提示 -->
    <div id="toast" class="fixed top-24 left-4 right-4 bg-health-green text-white px-6 py-4 rounded-xl shadow-lg transform -translate-y-full opacity-0 transition-all duration-300 z-50 flex items-center">
        <i class="fas fa-check-circle text-2xl mr-3"></i>
        <span class="text-lg font-medium" id="toastMessage">记录已保存</span>
    </div>

    <script>
        // 血压数据
        const bpData = {
            systolic: 120,
            diastolic: 80,
            pulse: 72
        };

        // 刻度范围配置
        const config = {
            systolic: { min: 60, max: 200, unit: 'mmHg', color: '#2563eb' },
            diastolic: { min: 40, max: 130, unit: 'mmHg', color: '#10b981' },
            pulse: { min: 40, max: 120, unit: 'bpm', color: '#f59e0b' }
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 设置当前时间
            setCurrentTime();

            // 初始化刻度
            initDialTicks('systolic', 60, 200);
            initDialTicks('diastolic', 40, 130);
            initDialTicks('pulse', 40, 120);

            // 更新转盘显示
            updateDial('systolic', 120);
            updateDial('diastolic', 80);
            updateDial('pulse', 72);

            // 绑定触摸滑动
            bindSwipeEvents('systolic');
            bindSwipeEvents('diastolic');
            bindSwipeEvents('pulse');

            // 更新血压状态
            updateBPStatus();
        });

        // 初始化刻度
        function initDialTicks(type, min, max) {
            const container = document.getElementById(type + 'Ticks');
            container.innerHTML = '';
            const range = max - min;
            for (let i = 0; i <= range; i += 10) {
                const tick = document.createElement('div');
                tick.className = i % 20 === 0 ? 'dial-tick major' : 'dial-tick';
                tick.style.transform = `translateX(-50%) rotate(${(i - min) / range * 270 - 135}deg)`;
                container.appendChild(tick);
            }
        }

        // 更新转盘显示
        function updateDial(type, value) {
            const indicator = document.getElementById(type + 'Indicator');
            const valueEl = document.getElementById(type + 'Value');
            const cfg = config[type];
            const range = cfg.max - cfg.min;
            const angle = ((value - cfg.min) / range) * 270 - 135;

            indicator.style.transform = `translateX(-50%) rotate(${angle}deg)`;
            valueEl.textContent = value;
            valueEl.style.color = cfg.color;

            // 添加动画
            valueEl.classList.add('bounce-in');
            setTimeout(() => valueEl.classList.remove('bounce-in'), 300);
        }

        // 调整数值
        function adjustValue(type, delta) {
            const cfg = config[type];
            bpData[type] = Math.max(cfg.min, Math.min(cfg.max, bpData[type] + delta));
            updateDial(type, bpData[type]);
            if (type !== 'pulse') updateBPStatus();
        }

        // 更新血压状态
        function updateBPStatus() {
            const sys = bpData.systolic;
            const dia = bpData.diastolic;
            const statusEl = document.getElementById('bpStatus');
            const iconEl = document.getElementById('bpStatusIcon');
            const textEl = document.getElementById('bpStatusText');

            let status, colorClass, bgClass;

            if (sys < 120 && dia < 80) {
                status = '血压正常';
                colorClass = 'text-health-green';
                bgClass = 'bg-green-100';
                iconEl.className = 'fas fa-check-circle text-2xl mr-2 text-health-green';
            } else if (sys >= 120 && sys < 140 || dia >= 80 && dia < 90) {
                status = '血压偏高';
                colorClass = 'text-alert-orange';
                bgClass = 'bg-orange-100';
                iconEl.className = 'fas fa-exclamation-circle text-2xl mr-2 text-alert-orange';
            } else if (sys >= 140 || dia >= 90) {
                status = '高血压';
                colorClass = 'text-alarm-red';
                bgClass = 'bg-red-100';
                iconEl.className = 'fas fa-exclamation-triangle text-2xl mr-2 text-alarm-red';
            } else {
                status = '偏低';
                colorClass = 'text-safe-blue';
                bgClass = 'bg-blue-100';
                iconEl.className = 'fas fa-arrow-down text-2xl mr-2 text-safe-blue';
            }

            textEl.textContent = status;
            textEl.className = 'text-lg font-medium ' + colorClass;
            statusEl.className = 'mt-6 p-4 rounded-xl text-center ' + bgClass;
        }

        // 设置当前时间
        function setCurrentTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent =
                now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' +
                now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }

        // 绑定滑动事件
        function bindSwipeEvents(type) {
            const dial = document.getElementById(type + 'Dial');
            let startY = 0;
            let startValue = bpData[type];

            dial.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                startValue = bpData[type];
            });

            dial.addEventListener('touchmove', (e) => {
                const deltaY = startY - e.touches[0].clientY;
                const delta = Math.round(deltaY / 3);
                const cfg = config[type];
                bpData[type] = Math.max(cfg.min, Math.min(cfg.max, startValue + delta));
                updateDial(type, bpData[type]);
                if (type !== 'pulse') updateBPStatus();
                e.preventDefault();
            });
        }

        // 保存记录
        function saveRecord() {
            showToast('血压记录已保存');
        }

        // Toast提示
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('-translate-y-full', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('-translate-y-full', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
